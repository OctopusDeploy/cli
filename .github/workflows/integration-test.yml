name: "Integration tests"
on:
  workflow_dispatch:
  # no push trigger, this only runs nightly
  schedule:
    # Daily 5am australian/brisbane time (7pm UTC)
    - cron: "0 19 * * *"
  push:
env:
  SA_PASSWORD: ${{ secrets.DB_IMAGE_SA_PASSWORD }}
  ADMIN_API_KEY: ${{ secrets.OD_IMAGE_ADMIN_API_KEY }}
  SERVER_URL: "http://localhost:8080"
jobs:
  # Decides in a separate job because the service containers below start before any step runs, so
  # gating steps would still pay for SQL Server and Octopus Server on every releases.json PR.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      any_changed: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v7

      - name: Check for significant changes
        id: changed-files
        if: github.event_name == 'push'
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files_ignore: |
            **.md
            releases.json
            .github/**

  test:
    needs: changes
    # Dependabot-triggered runs cannot read Actions secrets -- GitHub scopes those
    # to a separate Dependabot secrets store -- so SA_PASSWORD resolves to empty,
    # SQL Server rejects every login, and the service container never turns
    # healthy. Skip rather than fail red: the nightly run on main covers merged
    # bumps, and `gh workflow run integration-test.yml --ref <branch>` still works
    # on a Dependabot branch, because the triggering actor is then a human.
    #
    # A skipped job satisfies a required check, so pushes that only touch ignored files skip too.
    # If change detection itself fails, run the tests rather than silently skipping them.
    if: >-
      ${{ !cancelled() &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'push' ||
       needs.changes.result != 'success' ||
       needs.changes.outputs.any_changed == 'true') }}
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2019-CU27-ubuntu-20.04
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: ${{ env.SA_PASSWORD }}
          MSSQL_PID: Developer
        options: >-
          --health-cmd "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 10
          --health-start-period 10s
      octopusserver:
        image: octopusdeploy/octopusdeploy:latest
        env:
          ACCEPT_EULA: Y
          DB_CONNECTION_STRING: "Server=sqlserver;Database=OctopusDeploy;User Id=sa;Password=${{ env.SA_PASSWORD }};"
          ADMIN_API_KEY: ${{ env.ADMIN_API_KEY }}
          ENABLE_USAGE: N
          OCTOPUS_SERVER_BASE64_LICENSE: ${{ secrets.OCTOPUS_SERVER_BASE64_LICENSE }}
        ports:
          - 8080:8080

    permissions: # https://github.com/dorny/test-reporter/issues/168
      statuses: write
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Integration Tests
        env:
          OCTOPUS_TEST_URL: ${{ env.SERVER_URL }}
          OCTOPUS_TEST_APIKEY: ${{ env.ADMIN_API_KEY }}
        run: gotestsum --format testname --junitfile ../../integration-tests.xml
        working-directory: ./test/integration

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: success() || failure()
        with:
          name: Test Results
          path: "*-tests.xml"
          reporter: java-junit
