# TEMPORARY: verifies the paginated releases.json generation on a real runner.
# Remove before merging.
name: tmp-test-releases-json

on:
  pull_request:

permissions:
  contents: read

jobs:
  test-generate-releases-json:
    runs-on: ubuntu-latest
    steps:
      - name: Generate cli releases json (dry run, same command as go-releaser.yml)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh --version
          # Paginate so releases.json includes every release, not just the most recent 100
          set -o pipefail
          gh api --paginate --slurp "repos/OctopusDeploy/cli/releases?per_page=100" \
            | jq 'add' > "$RUNNER_TEMP/releases.json"
          jq -e 'type == "array" and length > 0' "$RUNNER_TEMP/releases.json" > /dev/null

      - name: Verify pagination worked
        run: |
          count=$(jq 'length' "$RUNNER_TEMP/releases.json")
          echo "Releases: $count"
          echo "Newest: $(jq -r '.[0].tag_name' "$RUNNER_TEMP/releases.json")"
          echo "Oldest: $(jq -r '.[-1].tag_name' "$RUNNER_TEMP/releases.json")"
          test "$count" -gt 100
          jq -e 'any(.[]; .tag_name == "v0.5.0")' "$RUNNER_TEMP/releases.json" > /dev/null
