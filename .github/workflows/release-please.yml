on:
  push:
    branches:
      - main
name: release-please
# release-please authenticates with INTEGRATIONS_MD_BOT_TOKEN, so the default GITHUB_TOKEN needs nothing beyond read
permissions:
  contents: read
jobs:
  release-please-release:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/release-please-action@v4
        id: release
        with:
          release-type: simple
          token: ${{ secrets.INTEGRATIONS_MD_BOT_TOKEN }}
          command: github-release
  release-please-pr:
    runs-on: ubuntu-latest
    needs:
      - release-please-release
    steps:
      - id: release-pr
        uses: google-github-actions/release-please-action@v4
        with:
          token: ${{ secrets.INTEGRATIONS_MD_BOT_TOKEN }}
          release-type: simple
          command: release-pr