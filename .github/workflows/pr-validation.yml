name: 'PR and Commit Validation'
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'
      - "releases.json"
jobs:
  test:
    runs-on: ubuntu-latest

    permissions: # https://github.com/dorny/test-reporter/issues/168
      statuses: write
      checks: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # if we just run the unit tests then go doesn't compile the parts of the app that aren't covered by
      # unit tests; this forces it
      - name: Build binary
        run: go build -o bin/octopus cmd/octopus/main.go

      - name: Setup gotestsum
        run: go install gotest.tools/gotestsum@latest

      # the shell quoting round trip tests run the generated commands through the real
      # shells; pwsh is already on the runner image but zsh isn't, and zsh is the strict
      # one because it expands a leading = and ~ where the other posix shells don't
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Unit Tests
        run: gotestsum --format testname --junitfile ../unit-tests.xml
        working-directory: ./pkg

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: success() || failure()
        with:
          name: Test Results
          path: '*-tests.xml'
          reporter: java-junit

  # the quoting this repo generates for cmd.exe and for Windows PowerShell can only be
  # checked on Windows, and the parent process detection it relies on doesn't compile
  # anywhere else. Only the two packages that have Windows specific behaviour are run;
  # the rest are already covered by the job above and don't need a second runner.
  test-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Shell Quoting Tests
        run: go test ./pkg/util/shell/... ./pkg/util/flag/...
